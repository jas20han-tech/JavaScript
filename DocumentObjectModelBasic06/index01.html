<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let number = prompt("Enter a Number")
    number = Number.parseInt(number)
    let value = confirm("do you want to square of this number")
    if(value==true){
      alert(number*number)
    }
    else{
      alert("No Problem")
    }
  </script>
</body>
